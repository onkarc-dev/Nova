services:
  api:
    command: npm run start:dev
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nova:nova@postgres:5432/nova?schema=public
      DIRECT_URL: postgresql://nova:nova@postgres:5432/nova?schema=public
      REDIS_URL: redis://redis:6379
volumes:
  api_node_modules:
